name: CareerOS CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-check:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: |
          frontend/package-lock.json
          backend/package-lock.json

    - name: Setup Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: 🎨 Frontend Check (Lint & Build)
      run: |
        cd frontend
        npm install
        npm run lint
        npm run build

    - name: ⚙️ Backend Check (Install & Syntax)
      run: |
        cd backend
        npm install
        # Run a basic syntax check on the main server file
        node --check server.js

    - name: 🤖 AI Service Check (Install & Syntax)
      run: |
        cd ai_service
        pip install -r requirements.txt
        # Check for basic Python syntax errors in main files
        python -m py_compile main.py
        python -m py_compile llm_manager.py
